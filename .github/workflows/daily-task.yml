name: 🎮 Daily Task (Gemini免费方案)

on:
  repository_dispatch:
    types: [daily-task]
  workflow_dispatch:
  schedule:
    - cron: '30 1,5,9,13,17 * * *'

concurrency:
  group: daily-task-run
  cancel-in-progress: true

jobs:
  run-task:
    name: 🎮 Daily Task
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -U playwright requests pyyaml 'hcaptcha-challenger>=0.19'
          python -m playwright install chromium --with-deps
          echo "✅ Python 依赖完成"

      - name: 4. 安装 Sing-Box（代理转换）
        if: env.PROXY_STR != ''
        env:
          PROXY_STR: ${{ secrets.TASK_PROXY_STR }}
        run: |
          curl -sL https://github.com/SagerNet/sing-box/releases/download/v1.9.3/sing-box-1.9.3-linux-amd64.tar.gz -o sb.tgz
          tar -xzf sb.tgz
          sudo cp sing-box-1.9.3-linux-amd64/sing-box /usr/local/bin/
          echo "✅ Sing-Box 就绪"

      - name: 5. 执行续期脚本
        env:
          ACCOUNTS:       ${{ secrets.TASK_ACCOUNTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROXY_STR:      ${{ secrets.TASK_PROXY_STR }}
          TASK_LOGIN_URL:    ${{ secrets.TASK_LOGIN_URL }}
          TASK_PROJECTS_URL: ${{ secrets.TASK_PROJECTS_URL }}
          TG_BOT_TOKEN:   ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:     ${{ secrets.TG_CHAT_ID }}
        run: python daily_task.py

      - name: 6. 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
